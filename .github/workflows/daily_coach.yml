name: Daily Fitness Agent
on:
  schedule:
    - cron: "12 6 * * *" # 8:12 AM CET
  workflow_dispatch:

jobs:
  run-fitness-agent:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mistral/fitness

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "./mistral/fitness/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          DOWNLOAD_DIR: "./training"
          GMAIL_APP_USER: ${{ secrets.GMAIL_APP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAYS_TO_ANALYZE: ${{ secrets.DAYS_TO_ANALYZE }}
          TRAINING_PHILOSOPHY: ${{ secrets.TRAINING_PHILOSOPHY }}
        run: node index.js
